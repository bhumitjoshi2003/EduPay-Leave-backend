name: Deploy Backend to VPS

on:
  push:
    branches:
      - main

env:
  IMAGE: ghcr.io/bhumitjoshi2003/edunexify-backend

jobs:
  # Builds happen here, not on the VPS — the previous setup ran `docker build`
  # (a full `mvn clean package` from scratch) directly on the production VPS,
  # competing with live traffic for CPU/RAM on every deploy. GitHub's runners are
  # dedicated and free for this, and pushing a tagged image also gives us a real
  # rollback path (pull an older :sha instead of git-reset + full rebuild).
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Build and verify compilation
        run: mvn compile -B

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ${{ env.IMAGE }}:latest
            ${{ env.IMAGE }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    needs: build-and-push
    runs-on: ubuntu-latest
    permissions:
      packages: read

    steps:
      # VPS now only pulls a ready image and swaps the container — no git checkout,
      # no Maven, no Docker build on the production host. Pull happens BEFORE the
      # old container is stopped, so the downtime window is just the container
      # swap itself, not the build time (previously: stop → build (~1-3min) → run).
      - name: Deploy to VPS via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          script: |
            mkdir -p ~/firebase-configs
            cat <<EOF > ~/firebase-configs/service-account.json
            ${{ secrets.FIREBASE_SERVICE_ACCOUNT_JSON }}
            EOF

            echo '${{ secrets.GITHUB_TOKEN }}' | docker login ghcr.io -u ${{ github.actor }} --password-stdin

            # Shared internal network with the AI service container — lets this
            # container reach it (and vice versa) by container name instead of
            # localhost, which doesn't cross container network namespaces.
            # Idempotent: whichever of the two deploy pipelines runs first creates it.
            docker network create edunexify-net 2>/dev/null || true

            docker pull ${{ env.IMAGE }}:${{ github.sha }}

            docker stop edunexify-backend-container || true
            docker rm -f edunexify-backend-container || true

            docker run -d \
              --restart unless-stopped \
              --log-driver json-file \
              --log-opt max-size=10m \
              --log-opt max-file=3 \
              --health-cmd="curl --fail http://localhost:8080/actuator/health || exit 1" \
              --health-interval=30s \
              --health-timeout=5s \
              --health-retries=3 \
              --name edunexify-backend-container \
              --network edunexify-net \
              -p 127.0.0.1:8080:8080 \
              -e SPRING_PROFILES_ACTIVE=prod \
              -e SPRING_DATASOURCE_URL='${{ secrets.DB_URL }}' \
              -e SPRING_DATASOURCE_USERNAME='${{ secrets.DB_USERNAME }}' \
              -e SPRING_DATASOURCE_PASSWORD='${{ secrets.DB_PASSWORD }}' \
              -e SPRING_JPA_DATABASE_PLATFORM=org.hibernate.dialect.PostgreSQLDialect \
              -e SPRING_MAIL_PASSWORD='${{ secrets.MAIL_PASSWORD }}' \
              -e JWT_PRIVATE_KEY='${{ secrets.JWT_PRIVATE_KEY }}' \
              -e JWT_PUBLIC_KEY='${{ secrets.JWT_PUBLIC_KEY }}' \
              -e FRONTEND_URL='${{ secrets.FRONTEND_URL }}' \
              -e RAZORPAY_KEY_ID='${{ secrets.RAZORPAY_KEY_ID }}' \
              -e RAZORPAY_KEY_SECRET='${{ secrets.RAZORPAY_KEY_SECRET }}' \
              -v /${{ secrets.VPS_USER }}/ias-uploads:/app/uploads \
              -v ~/firebase-configs/service-account.json:/app/firebase-service-account.json \
              -e FIREBASE_SERVICE_ACCOUNT_PATH=/app/firebase-service-account.json \
              -e REDIS_URL='${{ secrets.REDIS_URL }}' \
              -e DEMO_NOTIFY_EMAIL='${{ secrets.DEMO_NOTIFY_EMAIL }}' \
              -e AI_SERVICE_URL='${{ secrets.AI_SERVICE_URL }}' \
              -e AI_INTERNAL_SECRET='${{ secrets.AI_INTERNAL_SECRET }}' \
              ${{ env.IMAGE }}:${{ github.sha }}
