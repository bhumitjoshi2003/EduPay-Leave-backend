name: Deploy Backend to VPS

on:
  push:
    branches:
      - main

env:
  IMAGE: ghcr.io/bhumitjoshi2003/edunexify-backend

jobs:
  # Builds happen here, not on the VPS — the previous setup ran `docker build`
  # (a full `mvn clean package` from scratch) directly on the production VPS,
  # competing with live traffic for CPU/RAM on every deploy. GitHub's runners are
  # dedicated and free for this, and pushing a tagged image also gives us a real
  # rollback path (pull an older :sha instead of git-reset + full rebuild).
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Build and verify compilation
        run: mvn compile -B

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ${{ env.IMAGE }}:latest
            ${{ env.IMAGE }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    needs: build-and-push
    runs-on: ubuntu-latest
    permissions:
      packages: read

    steps:
      # VPS now only pulls a ready image and swaps the container — no git checkout,
      # no Maven, no Docker build on the production host. Pull happens BEFORE the
      # old container is stopped, so the downtime window is just the container
      # swap itself, not the build time (previously: stop → build (~1-3min) → run).
      - name: Deploy to VPS via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          script: |
            set -euo pipefail

            CONTAINER=edunexify-backend-container
            NEW_IMAGE="${{ env.IMAGE }}:${{ github.sha }}"

            mkdir -p ~/firebase-configs
            cat <<EOF > ~/firebase-configs/service-account.json
            ${{ secrets.FIREBASE_SERVICE_ACCOUNT_JSON }}
            EOF

            echo '${{ secrets.GITHUB_TOKEN }}' | docker login ghcr.io -u ${{ github.actor }} --password-stdin

            # Shared internal network with the AI service container — lets this
            # container reach it (and vice versa) by container name instead of
            # localhost, which doesn't cross container network namespaces.
            # Idempotent: whichever of the two deploy pipelines runs first creates it.
            docker network create edunexify-net 2>/dev/null || true

            # Remember what's currently running so we can restore it if the new
            # image fails its health check. Empty on the very first-ever deploy.
            PREVIOUS_IMAGE=$(docker inspect --format='{{.Config.Image}}' "$CONTAINER" 2>/dev/null || true)

            # Hard-fail here (set -e, no old container touched yet) if the new image
            # can't even be pulled — nothing to roll back, the old container just keeps running.
            docker pull "$NEW_IMAGE"

            run_container() {
              docker run -d \
                --restart unless-stopped \
                --log-driver json-file \
                --log-opt max-size=10m \
                --log-opt max-file=3 \
                --health-cmd="curl --fail http://localhost:8080/actuator/health || exit 1" \
                --health-interval=5s \
                --health-timeout=5s \
                --health-retries=3 \
                --health-start-period=45s \
                --name "$CONTAINER" \
                --network edunexify-net \
                -p 127.0.0.1:8080:8080 \
                -e SPRING_PROFILES_ACTIVE=prod \
                -e SPRING_DATASOURCE_URL='${{ secrets.DB_URL }}' \
                -e SPRING_DATASOURCE_USERNAME='${{ secrets.DB_USERNAME }}' \
                -e SPRING_DATASOURCE_PASSWORD='${{ secrets.DB_PASSWORD }}' \
                -e SPRING_JPA_DATABASE_PLATFORM=org.hibernate.dialect.PostgreSQLDialect \
                -e SPRING_MAIL_USERNAME='${{ secrets.MAIL_USERNAME }}' \
                -e SPRING_MAIL_PASSWORD='${{ secrets.MAIL_PASSWORD }}' \
                -e JWT_PRIVATE_KEY='${{ secrets.JWT_PRIVATE_KEY }}' \
                -e JWT_PUBLIC_KEY='${{ secrets.JWT_PUBLIC_KEY }}' \
                -e FRONTEND_URL='${{ secrets.FRONTEND_URL }}' \
                -e RAZORPAY_KEY_ID='${{ secrets.RAZORPAY_KEY_ID }}' \
                -e RAZORPAY_KEY_SECRET='${{ secrets.RAZORPAY_KEY_SECRET }}' \
                -v /${{ secrets.VPS_USER }}/ias-uploads:/app/uploads \
                -v ~/firebase-configs/service-account.json:/app/firebase-service-account.json \
                -e FIREBASE_SERVICE_ACCOUNT_PATH=/app/firebase-service-account.json \
                -e REDIS_URL='${{ secrets.REDIS_URL }}' \
                -e DEMO_NOTIFY_EMAIL='${{ secrets.DEMO_NOTIFY_EMAIL }}' \
                -e AI_SERVICE_URL='${{ secrets.AI_SERVICE_URL }}' \
                -e AI_INTERNAL_SECRET='${{ secrets.AI_INTERNAL_SECRET }}' \
                "$1"
            }

            # Polls the status docker itself maintains from --health-cmd above, until it
            # reports healthy/unhealthy or this times out. 24 x 5s = 120s, comfortably
            # past the 45s start-period + 3x5s retry window the container is configured with.
            wait_for_healthy() {
              for i in $(seq 1 24); do
                status=$(docker inspect --format='{{.State.Health.Status}}' "$CONTAINER" 2>/dev/null || echo "missing")
                echo "[$CONTAINER] health check $i/24: $status"
                if [ "$status" = "healthy" ]; then
                  return 0
                fi
                if [ "$status" = "unhealthy" ]; then
                  return 1
                fi
                sleep 5
              done
              return 1
            }

            docker stop "$CONTAINER" 2>/dev/null || true
            docker rm -f "$CONTAINER" 2>/dev/null || true

            # Tolerate a hard `docker run` failure here too (e.g. bad flag, port
            # conflict) — wait_for_healthy will see "missing" and time out into the
            # same rollback path below rather than aborting the script outright.
            run_container "$NEW_IMAGE" || true

            if wait_for_healthy; then
              echo "Deploy succeeded: $NEW_IMAGE is healthy."
            else
              echo "New image failed its health check — rolling back."
              docker logs --tail 100 "$CONTAINER" 2>&1 || true
              docker stop "$CONTAINER" 2>/dev/null || true
              docker rm -f "$CONTAINER" 2>/dev/null || true

              if [ -n "$PREVIOUS_IMAGE" ]; then
                echo "Restoring previous image: $PREVIOUS_IMAGE"
                docker pull "$PREVIOUS_IMAGE" 2>/dev/null || true
                run_container "$PREVIOUS_IMAGE" || true
                if wait_for_healthy; then
                  echo "Rollback succeeded: $PREVIOUS_IMAGE is healthy again."
                else
                  echo "Rollback ALSO failed its health check — manual intervention required."
                fi
              else
                echo "No previous image found (first-ever deploy) — nothing to roll back to."
              fi

              exit 1
            fi
