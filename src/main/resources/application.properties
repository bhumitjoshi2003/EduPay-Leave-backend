spring.application.name=ias-management
server.port=${PORT:8080}

# AI Copilot — Python FastAPI service
ai.service.url=${AI_SERVICE_URL:http://edunexify-ai-container:8090}
ai.internal.secret=${AI_INTERNAL_SECRET:dev-secret-change-in-prod}

# The AI stream endpoint (AiProxyController#chatStream) uses StreamingResponseBody, which
# requires Servlet async processing. After the async task finishes writing the response,
# Tomcat re-enters the full filter chain once more (dispatcher type ASYNC) to close out
# the async context. By default Spring Security's filter chain also runs on that pass —
# but the response is already fully committed by then, so if anything in the chain throws
# (e.g. re-evaluating auth state), ExceptionTranslationFilter can't write an error response
# ("Unable to handle the Spring Security Exception because the response is already
# committed"), Tomcat's error-page handling fails the same way, and the connection gets
# reset instead of closed cleanly — surfacing as "upstream prematurely closed connection"
# in nginx and a client-side stream error, even though the full reply already arrived.
# Excluding ASYNC (and FORWARD/INCLUDE) here stops the security chain from re-running on
# that redundant pass.
spring.security.filter.dispatcher-types=REQUEST,ERROR

# Multi-tenancy subdomain configuration
app.base-domain=${BASE_DOMAIN:edunexify.co.in}
app.tenant.subdomain-validation=${SUBDOMAIN_VALIDATION:true}

# Database
spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

# Flyway — the sole authority for schema changes (see the Phase 5C re-baseline report).
# Runs automatically as part of Spring Boot's own startup sequence (FlywayAutoConfiguration
# migrates before the JPA/Hibernate EntityManagerFactory is created), using the same
# datasource above — there is no separate "run mvn flyway:migrate as a deploy step" to
# forget. On a database that hasn't been re-baselined yet (i.e. anything other than a fresh
# install created after this change), startup will fail loudly at the Flyway step rather
# than silently diverge — that fail-fast behavior is intentional.
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
spring.flyway.baseline-on-migrate=false

# HikariCP Connection Pool
spring.datasource.hikari.pool-name=EdunexifyPool
spring.datasource.hikari.maximum-pool-size=8
spring.datasource.hikari.minimum-idle=0
spring.datasource.hikari.connection-timeout=5000
spring.datasource.hikari.idle-timeout=120000
spring.datasource.hikari.max-lifetime=1500000
spring.datasource.hikari.keepalive-time=0
spring.datasource.hikari.validation-timeout=3000

# Hibernate batch settings
spring.jpa.properties.hibernate.jdbc.batch_size=20
spring.jpa.properties.hibernate.order_inserts=true
spring.jpa.properties.hibernate.order_updates=true

frontend.url=${FRONTEND_URL}
image.upload.directory=./uploads/events/images
student.photo.directory=./uploads/student-photos
teacher.photo.directory=./uploads/teacher-photos
admin.photo.directory=./uploads/admin-photos
school.logo.directory=./uploads/school-logos
knowledge.upload.directory=./uploads/knowledge-base
# Relevance floor for Knowledge Base search results — see KnowledgeDocumentService's
# minSimilarity field for how this was measured and why it's tunable without a redeploy.
knowledge.search.min-similarity=0.35

# AI Copilot trace retention — see AiTraceCleanupScheduler. Kept short by default since
# traces can contain student-specific message/reply text.
ai.trace.retention-days=30

# Email
spring.mail.host=smtp-relay.brevo.com
spring.mail.port=2525
spring.mail.username=${MAIL_USERNAME}
app.mail.from=noreply@edunexify.co.in
spring.mail.password=${MAIL_PASSWORD}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true

# Actuator
# Base path moved under /api so nginx's existing /api/* proxy rule reaches it —
# nginx does not forward bare /actuator/* paths to this container.
management.endpoints.web.base-path=/api/actuator
management.endpoints.web.exposure.include=health
management.endpoint.health.show-details=never
management.endpoint.health.probes.enabled=true
# Container liveness must describe only the JVM/application lifecycle. In particular, it must
# never borrow a datasource connection or ping Redis. Readiness remains dependency-aware for
# traffic routing, but Redis is deliberately excluded because it is a best-effort cache whose
# failures are already handled without affecting application correctness.
management.endpoint.health.group.liveness.include=livenessState
management.endpoint.health.group.readiness.include=readinessState,db
management.health.mail.enabled=false

# Error-only monitoring. Blank DSN disables Sentry without affecting the application.
sentry.dsn=${SENTRY_DSN:}
sentry.environment=${SENTRY_ENVIRONMENT:production}
sentry.release=${RELEASE_SHA:}
logging.pattern.level=%5p [requestId:%X{requestId:-}]

# Better Stack heartbeat for NotificationDeliveryWorker.poll(). Blank disables it.
betterstack.notification-worker.heartbeat-url=${BETTERSTACK_NOTIFICATION_WORKER_HEARTBEAT_URL:}

# Better Stack heartbeat for EntitlementRefreshService.refreshAll(). Blank disables it.
betterstack.entitlement-refresh.heartbeat-url=${BETTERSTACK_ENTITLEMENT_REFRESH_HEARTBEAT_URL:}

# File upload
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB

# Jackson — serialize LocalDateTime as ISO-8601 strings, never as [year,month,day,...] arrays
spring.jackson.serialization.write-dates-as-timestamps=false
# Treat "" as null for object types (e.g. LocalDate) so empty form fields don't cause 400 errors
spring.jackson.deserialization.accept-empty-string-as-null-object=true

# JWT
jwt.private-key=${JWT_PRIVATE_KEY}
jwt.public-key=${JWT_PUBLIC_KEY}
jwt.access-token.expiry-minutes=${JWT_ACCESS_EXPIRY:60}
jwt.refresh-token.expiry-days=${JWT_REFRESH_EXPIRY:7}

# Auth cookie
auth.cookie.secure=${AUTH_COOKIE_SECURE:true}
auth.cookie.sameSite=${AUTH_COOKIE_SAMESITE:Lax}

#Razorpay
razorpay.key.id=${RAZORPAY_KEY_ID}
razorpay.key.secret=${RAZORPAY_KEY_SECRET}
razorpay.webhook.secret=${RAZORPAY_WEBHOOK_SECRET:}
# Online payment pricing (gateway rate/tax, Edunexify transaction fee) is no longer
# environment-variable-backed — see payment_pricing_config / PaymentPricingService. The
# database is the CURRENT/FUTURE pricing authority; the app boots fine with zero configured
# versions, but online order creation fails closed until a Platform Admin creates one.

# Firebase
app.firebase.service-account-path=${FIREBASE_SERVICE_ACCOUNT_PATH:}

# Redis
spring.data.redis.url=${REDIS_URL:redis://localhost:6379}

# Notification delivery — Redis fast-path wake-up (default OFF for safe rollout).
# When false: unchanged legacy behavior — NotificationDeliveryWorker.poll() queries PostgreSQL
# every notification.delivery.poll-interval-ms (default 30s) regardless of whether there is work.
# When true: that legacy poll returns without touching PostgreSQL; a Redis Stream signal (published
# only after a notification's business transaction commits) wakes a consumer that re-runs the same
# generic claim query instead. See NotificationDeliveryRedisSignaler / NotificationDeliveryStreamConsumerConfig
# / NotificationDeliveryRedisMaintenanceScheduler.
notification.delivery.redis.enabled=${NOTIFICATION_DELIVERY_REDIS_ENABLED:false}
notification.delivery.redis.stream-key=notification:delivery:stream
notification.delivery.redis.consumer-group=notification-delivery-workers
notification.delivery.redis.retry-zset-key=notification:delivery:retry
notification.delivery.redis.consumer-block-ms=5000
notification.delivery.redis.batch-size=10
# How often the Redis-only retry/pending-entry check runs (never touches PostgreSQL unless the
# check itself finds due work) — not the same as the reconciliation sweep below.
notification.delivery.redis.retry-check-interval-ms=20000
# Idle time before a stream message is considered abandoned by its original consumer and eligible
# for another consumer to reclaim (XCLAIM).
notification.delivery.redis.pending-claim-min-idle-ms=60000
# Rare DB safety-net sweep, active only in Redis mode — one claim pass per interval.
notification.delivery.reconciliation-interval-ms=3600000

# Teacher attendance reminder — dynamic per-school scheduling (default OFF for safe rollout).
# When false: unchanged legacy behavior — TeacherAttendanceReminderScheduler.sendTeacherAttendanceReminders()
# scans every reminder-enabled school every 5 minutes via a global PostgreSQL query, regardless of
# whether any school is actually due.
# When true: that legacy scan returns before touching PostgreSQL; TeacherAttendanceReminderDynamicScheduler
# instead schedules one dynamic task per reminder-enabled school, firing at that school's own configured
# local reminder time, so PostgreSQL is only touched exactly when a school is due (plus startup rebuild
# and admin settings changes). See TeacherAttendanceReminderDynamicScheduler.
teacher.attendance.reminder.dynamic-scheduling.enabled=${TEACHER_ATTENDANCE_REMINDER_DYNAMIC_SCHEDULING_ENABLED:false}
# Bounded single-retry delay if PostgreSQL is unavailable at a school's scheduled fire time — stays
# well within the existing 30-minute catch-up window; never a tight retry loop.
teacher.attendance.reminder.dynamic-scheduling.db-retry-delay-minutes=5

# Refund reconciliation — dynamic per-refund follow-up (default OFF for safe rollout).
# When false: unchanged legacy behavior — RefundReconciliationJob.poll() queries PostgreSQL for
# stale PENDING refunds every refund.reconciliation.fixed-delay-ms (default 5 min), regardless of
# whether any refund is actually pending.
# When true: that legacy poll returns before touching PostgreSQL; RefundReconciliationDynamicScheduler
# instead schedules a bounded, tapering per-refund follow-up only when a refund is explicitly
# initiated and remains PENDING with a known provider refund id — never on a timer. See
# RefundReconciliationDynamicScheduler.
refund.reconciliation.dynamic.enabled=${REFUND_RECONCILIATION_DYNAMIC_ENABLED:false}
# Rare, restart-proof safety sweep (daily by default) — catches a refund whose dynamic follow-up
# was itself missed (a restart mid-sequence, an internal callback failure). Only ever queries
# PENDING refunds with a known provider id, exactly like the legacy job's own candidate query.
refund.reconciliation.safety-interval-ms=86400000

# Refund initiation kill switch (default ON — unchanged current behavior). See
# PaymentController.refundInitiationEnabled's javadoc for why this exists instead of a role
# change: SUPER_ADMIN's JWT carries no schoolId, so it cannot cleanly replace the ADMIN check on
# this school-scoped endpoint without deeper changes. Set to false only when explicitly ready to
# lock the endpoint down operationally.
refund.initiation.enabled=${REFUND_INITIATION_ENABLED:true}

# Pagination defaults
spring.data.web.pageable.default-page-size=20
spring.data.web.pageable.max-page-size=100

app.demo.notify.email=${DEMO_NOTIFY_EMAIL}
