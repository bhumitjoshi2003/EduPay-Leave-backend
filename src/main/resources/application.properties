spring.application.name=ias-management
server.port=${PORT:8080}

# AI Copilot — Python FastAPI service
ai.service.url=${AI_SERVICE_URL:http://edunexify-ai-container:8090}
ai.internal.secret=${AI_INTERNAL_SECRET:dev-secret-change-in-prod}

# The AI stream endpoint (AiProxyController#chatStream) uses StreamingResponseBody, which
# requires Servlet async processing. After the async task finishes writing the response,
# Tomcat re-enters the full filter chain once more (dispatcher type ASYNC) to close out
# the async context. By default Spring Security's filter chain also runs on that pass —
# but the response is already fully committed by then, so if anything in the chain throws
# (e.g. re-evaluating auth state), ExceptionTranslationFilter can't write an error response
# ("Unable to handle the Spring Security Exception because the response is already
# committed"), Tomcat's error-page handling fails the same way, and the connection gets
# reset instead of closed cleanly — surfacing as "upstream prematurely closed connection"
# in nginx and a client-side stream error, even though the full reply already arrived.
# Excluding ASYNC (and FORWARD/INCLUDE) here stops the security chain from re-running on
# that redundant pass.
spring.security.filter.dispatcher-types=REQUEST,ERROR

# Multi-tenancy subdomain configuration
app.base-domain=${BASE_DOMAIN:edunexify.co.in}
app.tenant.subdomain-validation=${SUBDOMAIN_VALIDATION:true}

# Database
spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

# Flyway — the sole authority for schema changes (see the Phase 5C re-baseline report).
# Runs automatically as part of Spring Boot's own startup sequence (FlywayAutoConfiguration
# migrates before the JPA/Hibernate EntityManagerFactory is created), using the same
# datasource above — there is no separate "run mvn flyway:migrate as a deploy step" to
# forget. On a database that hasn't been re-baselined yet (i.e. anything other than a fresh
# install created after this change), startup will fail loudly at the Flyway step rather
# than silently diverge — that fail-fast behavior is intentional.
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
spring.flyway.baseline-on-migrate=false

# HikariCP Connection Pool
spring.datasource.hikari.pool-name=EdunexifyPool
spring.datasource.hikari.maximum-pool-size=30
spring.datasource.hikari.minimum-idle=10
spring.datasource.hikari.connection-timeout=15000
spring.datasource.hikari.idle-timeout=600000
spring.datasource.hikari.max-lifetime=1800000
spring.datasource.hikari.keepalive-time=60000
spring.datasource.hikari.connection-test-query=SELECT 1

# Hibernate batch settings
spring.jpa.properties.hibernate.jdbc.batch_size=20
spring.jpa.properties.hibernate.order_inserts=true
spring.jpa.properties.hibernate.order_updates=true

frontend.url=${FRONTEND_URL}
image.upload.directory=./uploads/events/images
student.photo.directory=./uploads/student-photos
teacher.photo.directory=./uploads/teacher-photos
admin.photo.directory=./uploads/admin-photos
school.logo.directory=./uploads/school-logos
knowledge.upload.directory=./uploads/knowledge-base
# Relevance floor for Knowledge Base search results — see KnowledgeDocumentService's
# minSimilarity field for how this was measured and why it's tunable without a redeploy.
knowledge.search.min-similarity=0.35

# AI Copilot trace retention — see AiTraceCleanupScheduler. Kept short by default since
# traces can contain student-specific message/reply text.
ai.trace.retention-days=30

# Email
spring.mail.host=smtp-relay.brevo.com
spring.mail.port=2525
spring.mail.username=${MAIL_USERNAME}
app.mail.from=noreply@edunexify.co.in
spring.mail.password=${MAIL_PASSWORD}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true

# Actuator
management.endpoints.web.exposure.include=health
management.endpoint.health.show-details=never
management.endpoint.health.probes.enabled=true
management.health.mail.enabled=false

# File upload
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB

# Jackson — serialize LocalDateTime as ISO-8601 strings, never as [year,month,day,...] arrays
spring.jackson.serialization.write-dates-as-timestamps=false
# Treat "" as null for object types (e.g. LocalDate) so empty form fields don't cause 400 errors
spring.jackson.deserialization.accept-empty-string-as-null-object=true

# JWT
jwt.private-key=${JWT_PRIVATE_KEY}
jwt.public-key=${JWT_PUBLIC_KEY}
jwt.access-token.expiry-minutes=${JWT_ACCESS_EXPIRY:60}
jwt.refresh-token.expiry-days=${JWT_REFRESH_EXPIRY:7}

# Auth cookie
auth.cookie.secure=${AUTH_COOKIE_SECURE:true}
auth.cookie.sameSite=${AUTH_COOKIE_SAMESITE:Lax}

#Razorpay
razorpay.key.id=${RAZORPAY_KEY_ID}
razorpay.key.secret=${RAZORPAY_KEY_SECRET}
razorpay.webhook.secret=${RAZORPAY_WEBHOOK_SECRET:}

# Firebase
app.firebase.service-account-path=${FIREBASE_SERVICE_ACCOUNT_PATH:}

# Redis
spring.data.redis.url=${REDIS_URL:redis://localhost:6379}

# Pagination defaults
spring.data.web.pageable.default-page-size=20
spring.data.web.pageable.max-page-size=100

app.demo.notify.email=${DEMO_NOTIFY_EMAIL}