# Flyway (see application.properties) now owns every schema change. validate makes
# Hibernate refuse to boot on any mismatch between the entities and what Flyway actually
# built, instead of silently patching a production schema — see the Phase 5C re-baseline
# report. IMPORTANT: this requires the target database to already be on the new Flyway
# baseline (V1__baseline_schema.sql onward) before this build is deployed to it — a
# database still running the old, never-Flyway-tracked schema will fail to start against
# this build (Flyway will refuse to apply V1 over tables that already exist). That failure
# is intentional fail-fast behavior, not a bug.
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false

# Extra production safety
server.error.include-stacktrace=never
server.error.include-message=never

# HTTP security
auth.cookie.secure=true
# None (with Secure=true) so cookies are sent on cross-origin requests from school
# subdomains (e.g. indra-academy.edunexify.co.in) to the root-domain API
# (edunexify.co.in/api). Both are same-site (shared eTLD+1 = edunexify.co.in) so
# Chrome's third-party cookie blocking does NOT apply. SameSite=Lax was blocking
# cookies on cross-origin XHR from subdomains to the root domain API.
auth.cookie.sameSite=None