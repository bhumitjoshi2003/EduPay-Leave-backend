# Development-specific overrides

# AI Copilot dev overrides
ai.service.url=http://localhost:8090
ai.internal.secret=dev-secret-change-in-prod
# Disable tenant validation for local development
app.tenant.subdomain-validation=false

# Local Angular runs on http://localhost:4200. Cookies must be host-only and
# non-secure there, otherwise the browser rejects the login cookies.
app.base-domain=
auth.cookie.secure=false
auth.cookie.sameSite=Lax


# Flyway (see application.properties) now owns every schema change. validate makes
# Hibernate refuse to boot on any mismatch between the entities and what Flyway actually
# built, instead of silently patching the schema — see the Phase 5C re-baseline report for
# why ddl-auto=update was retired and why the switch was only made after proving the full
# Flyway migration set produces a schema Hibernate validates against with zero complaints.
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false