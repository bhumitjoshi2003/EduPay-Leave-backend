# Development-specific overrides

# AI Copilot dev overrides
ai.service.url=http://localhost:8090
ai.internal.secret=dev-secret-change-in-prod
# Disable tenant validation for local development
app.tenant.subdomain-validation=false

# Local Angular runs on http://localhost:4200. Cookies must be host-only and
# non-secure there, otherwise the browser rejects the login cookies.
app.base-domain=
auth.cookie.secure=false
auth.cookie.sameSite=Lax


spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false